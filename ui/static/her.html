<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>voidOS</title>
<!-- critical: paint the dark theme instantly so chromium never flashes white before her.css loads -->
<style>html,body{margin:0;height:100%;background:#0b0506}</style>
<link rel="stylesheet" href="/her.css?v=7" />
</head>
<body data-state="idle">
  <canvas id="orb"></canvas>

  <header id="bar">
    <span id="clock">—</span>
    <span id="brand">voidOS</span>
  </header>

  <main id="stage">
    <div id="you"></div>
    <div id="reply">Hey — I'm voidOS. What do you need?</div>
  </main>

  <form id="ask" autocomplete="off">
    <input id="input" placeholder="tell me what you need…" autofocus />
  </form>

  <script src="/her.js?v=10"></script>
</body>
</html>
